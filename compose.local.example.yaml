name: qms
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qms
      MYSQL_USER: qms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
  api:
    build: ./backend
    environment:
      QMS_DB_URL: jdbc:mysql://mysql:3306/qms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      QMS_DB_USERNAME: qms
      QMS_DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      QMS_GATEWAY_SHARED_TOKEN: ${QMS_GATEWAY_SHARED_TOKEN:?required}
      QMS_BTF_HESSIAN_ALLOWED_IPS: ${QMS_BTF_HESSIAN_ALLOWED_IPS:-}
      QMS_BTF_HESSIAN_TENANT_CODE: ${QMS_BTF_HESSIAN_TENANT_CODE:-}
      QMS_SECURITY_DEVELOPMENT_MODE: "false"
      QMS_WEB_CORS_ALLOWEDORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
      QMS_LOCAL_PASSWORD_LOGIN_ENABLED: "true"
      QMS_LOCAL_LOGIN_JWT_SECRET: ${QMS_LOCAL_LOGIN_JWT_SECRET:?required}
      QMS_EQUIPMENT_TELEMETRY_RETENTION_ENABLED: "false"
      QMS_AUTO_INSPECTION_ENABLED: "false"
      QMS_OCR_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - attachments-data:/app/uploads
    ports:
      - "0.0.0.0:8082:8080"
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5174:80"
volumes:
  mysql-data:
  attachments-data:
