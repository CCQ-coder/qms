server {
    listen 127.0.0.1:5175 ssl proxy_protocol;
    server_name gongying.duckdns.org;

    ssl_certificate /etc/qms-public/server.crt;
    ssl_certificate_key /etc/qms-public/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location ~ ^/api/v1/flying-probe/device-(files|host-status)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    root /www/sites/qms/index/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:5174 proxy_protocol;
    server_name gongying.duckdns.org;
    return 308 https://gongying.duckdns.org:5173$request_uri;
}
