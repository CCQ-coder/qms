server {
    listen 127.0.0.1:5175 ssl proxy_protocol default_server;
    server_name 106.227.69.144;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/qms-device/server-new.crt;
    ssl_certificate_key /etc/qms-device/server-new.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location ~ ^/api/v1/flying-probe/device-(files|host-status)$ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    root /www/sites/qms/index/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
