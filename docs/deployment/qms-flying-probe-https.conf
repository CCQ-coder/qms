server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 106.227.69.144;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/qms-device/server.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/qms-device/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location ~ ^/api/v1/flying-probe/device-(files|host-status)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
