server {
    listen 127.0.0.1:5174 proxy_protocol;
    server_name 106.227.69.144;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/qms/log/access.log main;
    error_log /www/sites/qms/log/error.log;
    location ~ ^/api/v1/flying-probe/device-(files|host-status)$ {
        return 426;
    }
    location ~ ^/api/v1/equipment/gateway-mappings/[^/]+/upload-token$ {
        return 426;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    root /www/sites/qms/index/dist;
    error_page 404 /404.html;
}
